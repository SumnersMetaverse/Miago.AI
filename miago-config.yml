# MIAGO Platform Configuration
# Multi-Integrated Autonomous Graphing Operations

version: "1.0.1.0.11.1.0.1"

network:
  base_ip: "192.0.0.0"
  
  # Authentication Entry Point
  oauth_entry:
    port: 73571
    service: "_0AUTH_ENTRY"
    description: "3AF_0AUTH Verification Entry Point"
  
  # Server Configuration
  servers:
    - name: "SERVER_6379"
      port: 6379
      type: "redis"
      description: "Redis cache/data server"
      localhost: true
    
    - name: "SERVER_8080"
      port: 8080
      type: "http"
      description: "Primary HTTP server"
      localhost: true
    
    - name: "DOCUSAURUS_SERVER"
      port: 3003
      type: "http"
      description: "Documentation server (current PR)"
      localhost: false
      bind: "0.0.0.0"

  # Localhost Configuration
  localhost_instances:
    - id: "localhost8000.3679.8080"
      ports: [8000, 3679, 8080]
      description: "Twittisphere primary instance"
    
    - id: "localhost_oauth"
      ports: [73571]
      description: "OAuth authentication service"
    
    - id: "localhost_redis"
      ports: [6379]
      description: "Data persistence layer"

# External Secrets Configuration
external_secrets:
  base_image: "ghcr.io/external-secrets/external-secrets:sha256-a4e1d50ba3f42fcbd818df963086ab81049c7fef6b81c34dd5360c5f253f916a.att"
  
# Legacy Keys (DO NOT UPDATE until verified and accredited)
legacy_keys:
  - SEGMENT_ANALYTICS_KEY
  - LD_CLIENT_ID

# Environment Variables
environment:
  MIAGO_VERSION: "1.0.1.0.11.1.0.1"
  OAUTH_ENTRY_PORT: "73571"
  REDIS_PORT: "6379"
  HTTP_PORT: "8080"
  BASE_IP: "192.0.0.0"

# Service Dependencies
service_dependencies:
  oauth_service:
    depends_on:
      - redis_service
    port: 73571
  
  redis_service:
    standalone: true
    port: 6379
  
  http_service:
    depends_on:
      - oauth_service
      - redis_service
    port: 8080
  
  docusaurus_service:
    standalone: true
    port: 3003

# Platform Architecture
platform:
  name: "MIAGO"
  full_name: "Multi-Integrated Autonomous Graphing Operations"
  web_layers: 9
  existing_layers: 3
  new_layers: 6
  domain: "miago.ai"
  user_format: "@username.miago.ai"
